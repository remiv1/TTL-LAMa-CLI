[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "ttlama-cli"
version = "0.1.0"
description = "Interface en ligne de commande pour TTL-LAMa"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27,<1",
    "platformdirs>=4,<5",
    "requests>=2,<3",
    "keyring>=25,<26",
    "rich>=15,<16",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
ttlama = "ttlama_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
