services:
  server:
    image: ghcr.io/remiv1/ttl-lama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cp /run/ttl-lama/config-seed.yml /tmp/ttlama-config.yml && exec sh /opt/ttl-lama/src/entrypoint.sh"
    environment:
      TTL_LAMA_CONFIG_FILE: /tmp/ttlama-config.yml
      TTL_LAMA_FLASK_ENV: development
      TTL_LAMA_ADMIN_USERNAME: cli-integration-admin
      TTL_LAMA_ADMIN_PASSWORD: cli-integration-password
      TTL_LAMA_SESSION_COOKIE_SECURE: "false"
      TTL_LAMA_ENFORCE_SECURE_CONNECTION: "false"
    volumes:
      - ../src/config/config.yml:/run/ttl-lama/config-seed.yml:ro,z
    ports:
      - "58080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  cli-tests:
    user: "0"
    build:
      context: .
      dockerfile: Dockerfile.test
    cap_add:
      - NET_ADMIN
    environment:
      TTLAMA_TEST_SERVER_URL: http://server
      TTLAMA_TEST_SERVER_PORT: "8080"
      TTLAMA_TEST_ADMIN_USERNAME: cli-integration-admin
      TTLAMA_TEST_ADMIN_PASSWORD: cli-integration-password
      XDG_CONFIG_HOME: /tmp/ttlama-cli-config
    depends_on:
      server:
        condition: service_healthy